<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#991b1b"><title>Buku Tamu Digital | ADM Priangan 2</title>
<style>
:root{--red:#b91c1c;--red-dark:#7f1d1d;--ink:#172033;--muted:#718096;--line:#e7eaf0;--surface:#fff;--soft:#fff7f7;--shadow:0 24px 70px rgba(31,41,55,.12)}
*{box-sizing:border-box}
html{min-height:100%;background:#f5f6fa}
body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(ellipse at 10% 5%,rgba(254,226,226,.9),transparent 35%),radial-gradient(ellipse at 90% 90%,rgba(226,232,240,.8),transparent 38%),#f5f6fa;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.gb-public-page{width:100%;max-width:1080px;margin:0 auto;padding:0}
.gb-public-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:0 42px 30px;box-shadow:var(--shadow)}
.gb-public-card:before{content:"";display:block;height:9px;margin:0 -42px 30px;background:linear-gradient(90deg,#7f1d1d,#dc2626 55%,#fb7185)}
.gb-public-card:after{content:"";position:absolute;z-index:0;top:36px;right:-78px;width:210px;height:210px;border:1px solid rgba(185,28,28,.08);border-radius:50%;box-shadow:0 0 0 22px rgba(185,28,28,.025),0 0 0 48px rgba(185,28,28,.018);pointer-events:none}
.gb-public-brand{position:relative;z-index:1;display:inline-flex;align-items:center;gap:9px;color:var(--red);font-size:10px;font-weight:850;letter-spacing:1.8px;text-transform:uppercase}
.gb-public-brand:before{content:"▤";display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#fff1f2;color:var(--red);font-size:19px;letter-spacing:0}
.gb-public-card h1{position:relative;z-index:1;margin:22px 0 8px;font-size:clamp(27px,5vw,36px);line-height:1.12;letter-spacing:-1.2px;font-weight:850;color:#171923}
.gb-public-card>p{position:relative;z-index:1;margin:0;max-width:510px;color:var(--muted);font-size:14px;line-height:1.7}
.gb-public-branch{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:24px 0 22px;padding:14px 16px;border:1px solid #fee2e2;border-radius:15px;background:linear-gradient(110deg,#fff7f7,#fff);color:#991b1b;font-size:13px;font-weight:750}
.gb-public-branch:before{content:"⌖";display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:10px;background:#fee2e2;color:#b91c1c;font-size:18px}
#gb-public-form-wrap{position:relative;z-index:1}
.gb-field{margin:0 0 19px}
.gb-field label{display:flex;align-items:center;gap:5px;margin:0 0 8px;color:#303747;font-size:13px;font-weight:750;letter-spacing:.1px}
.gb-field input,.gb-field textarea{display:block;width:100%;min-height:48px;padding:13px 15px;border:1px solid #dfe3eb;border-radius:13px;background:#fbfcfe;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
.gb-field textarea{min-height:100px;resize:vertical}
.gb-field input::placeholder,.gb-field textarea::placeholder{color:#a0a8b7}
.gb-field input:hover,.gb-field textarea:hover{border-color:#c6ccd7}
.gb-field input:focus,.gb-field textarea:focus{border-color:#dc5555;background:#fff;box-shadow:0 0 0 4px rgba(220,38,38,.09)}
.gb-sign-wrap{border:1px solid #e3e7ef;border-radius:15px;background:#fbfcfe;padding:12px}
.gb-sign-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;color:#475569;font-size:12px}
.gb-sign-actions{display:flex;gap:7px}
.gb-sign-actions button{border:1px solid #e2e8f0;border-radius:9px;background:#fff;color:#475569;padding:7px 11px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.gb-sign-canvas{display:block;width:100%;height:150px;border:1px dashed #cbd5e1;border-radius:11px;background:#fff;touch-action:none;cursor:crosshair}
.gb-sign-hint{margin-top:8px;color:#94a3b8;font-size:11px}
.gb-submit{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:53px;margin-top:8px;padding:14px 20px;border:0;border-radius:14px;background:linear-gradient(105deg,#991b1b,#dc2626);box-shadow:0 10px 22px rgba(185,28,28,.2);color:#fff;font:inherit;font-size:14px;font-weight:850;letter-spacing:.4px;cursor:pointer;transition:transform .18s,box-shadow .18s,opacity .18s}
.gb-submit:after{content:"→";font-size:19px;font-weight:500}
.gb-submit:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(185,28,28,.25)}
.gb-submit:active{transform:translateY(0)}
.gb-submit:disabled{opacity:.65;cursor:wait;transform:none}
.gb-loading{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px}
.gb-success{padding:30px 20px;text-align:center;border:1px solid #bbf7d0;border-radius:18px;background:linear-gradient(145deg,#f0fdf4,#fff);color:#166534}
.gb-success i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:#dcfce7;font-style:normal;font-size:28px}
.gb-success h2{margin:0 0 7px;color:#166534;font-size:23px}
.gb-success p{margin:0;color:#39805a;font-size:14px;line-height:1.6}
.gb-error{margin:12px 0 0;padding:11px 13px;border:1px solid #fecaca;border-radius:11px;background:#fff1f2;color:#b91c1c;font-size:13px;line-height:1.5}
.gb-public-card footer{margin-top:26px!important;padding-top:18px;border-top:1px solid #eef0f4;color:#9aa3b2!important;font-size:11px!important;letter-spacing:.2px}
@media(max-width:600px){body{padding:14px 10px;background:#f6f7fb}.gb-public-card{border-radius:21px;padding:0 21px 23px}.gb-public-card:before{height:7px;margin:0 -21px 23px}.gb-public-card:after{top:30px;right:-120px}.gb-public-card h1{margin-top:19px;font-size:29px}.gb-public-card>p{font-size:13px}.gb-public-branch{margin:20px 0;padding:12px}.gb-field{margin-bottom:16px}.gb-field input,.gb-field textarea{border-radius:12px}.gb-submit{min-height:51px}}



@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

.gb-public-nav{position:relative;z-index:1;display:flex;justify-content:flex-end;margin:18px 0 4px}
.gb-public-nav a{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border:1px solid #fee2e2;border-radius:12px;background:#fff7f7;color:#991b1b;text-decoration:none;font-size:12px;font-weight:800;transition:background .18s,transform .18s}
.gb-public-nav a:hover{background:#fee2e2;transform:translateY(-1px)}
@media(max-width:600px){.gb-public-nav{justify-content:stretch}.gb-public-nav a{width:100%;justify-content:center}}


/* Modern concept 1 — polished red header + clean form */
body{padding:24px 16px;background:radial-gradient(circle at 5% 0%,#ffe4e6 0,transparent 34%),linear-gradient(145deg,#f8fafc,#f1f5f9)}
.gb-public-page{max-width:820px}
.gb-public-card{padding:28px 36px 30px;border-radius:28px;box-shadow:0 24px 65px rgba(15,23,42,.12)}
.gb-public-card:before{position:absolute;z-index:0;top:0;left:0;right:0;height:190px;margin:0;background:linear-gradient(115deg,#8f1118,#c51624 65%,#ef4444)}
.gb-public-card:after{top:55px;right:-90px;border-color:rgba(255,255,255,.13);box-shadow:0 0 0 24px rgba(255,255,255,.045),0 0 0 50px rgba(255,255,255,.025)}
.gb-public-brand{color:#fff;letter-spacing:2px}
.gb-public-brand:before{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.2)}
.gb-public-card h1{margin-top:25px;color:#fff;font-size:clamp(28px,5vw,36px)}
.gb-public-card>p{color:rgba(255,255,255,.84);max-width:560px}
.gb-public-branch{margin:26px 0 22px;background:#fff8f8;border-color:#fecaca;box-shadow:0 8px 20px rgba(127,29,29,.05)}
.gb-public-nav{margin:0 0 18px}
.gb-public-nav a{background:#fff;border-color:#fee2e2;box-shadow:0 4px 12px rgba(127,29,29,.05)}
#gb-public-form-wrap form{padding:22px 10px 0}
.gb-field{margin-bottom:18px}
.gb-field label{font-size:13px;color:#1e293b}
.gb-field input,.gb-field textarea{border-radius:14px;background:#f8fafc;border-color:#dce3ed;min-height:50px;padding:14px 16px}
.gb-field textarea{min-height:105px}
.gb-field input:focus,.gb-field textarea:focus{background:#fff;border-color:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.09)}
.gb-sign-wrap{padding:13px;border-radius:17px;background:#f8fafc}
.gb-sign-canvas{height:160px;border-radius:13px;background:linear-gradient(#fff,#fff)}
.gb-submit{min-height:56px;border-radius:15px;background:linear-gradient(100deg,#a80f1b,#e11d2e);box-shadow:0 12px 24px rgba(185,28,28,.22);font-size:14px}
.gb-public-card footer{position:relative;z-index:1}
@media(max-width:600px){
 body{padding:12px 9px}
 .gb-public-card{padding:22px 18px 22px;border-radius:22px}
 .gb-public-card:before{height:205px}
 .gb-public-card h1{font-size:29px;margin-top:24px}
 .gb-public-card>p{font-size:12px}
 .gb-public-branch{margin:22px 0 16px}
 #gb-public-form-wrap form{padding:14px 0 0}
 .gb-public-nav{margin-bottom:12px}
 .gb-field{margin-bottom:15px}
 .gb-sign-canvas{height:145px}
}

</style></head><body>
<main class="gb-public-page"><section class="gb-public-card">
<div class="gb-public-brand">ADM PRIANGAN 2 · BUKU TAMU DIGITAL</div>
<h1>Form Buku Tamu</h1><p>Selamat datang. Silakan isi data kunjungan Anda. Data akan langsung tercatat setelah dikirim.</p>
<div id="gb-public-branch" class="gb-public-branch">Memvalidasi link cabang…</div>
<div class="gb-public-nav"><a id="gb-open-history" href="#">▤ Lihat Riwayat Kunjungan</a></div>
<div id="gb-public-form-wrap" class="gb-loading">Mohon tunggu sebentar…</div>
<footer style="text-align:center;color:#94a3b8;font-size:11px;margin-top:22px">Sistem Buku Tamu Digital · ADM Priangan 2</footer>
</section></main>
<script>
const GB_API = 'https://script.google.com/macros/s/AKfycbxjk1LKASe0zd5rTkf0eXKtBdBie1uoDHA9HAs2YM2P8DhiKaYQsrZ_xZ88eD8nucdL_g/exec';
const gbEsc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbPost = async payload => {
  const r=await fetch(GB_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify(payload)});
  const data=await r.json();
  if(!r.ok || data?.status==='error' || data?.success===false) throw new Error(data?.message||`Permintaan gagal (${r.status})`);
  return data;
};
  async function gbSubmitPublic(event){
    event.preventDefault();const form=event.currentTarget,btn=form.querySelector('button[type=submit]');if(btn.disabled)return;
    const token=(new URLSearchParams(location.search).get('token')||'').trim();
    const signature=window.gbSignatureData();
    const payload={action:'saveGuestbookEntry',token,name:form.nama.value.trim(),jabatan:form.jabatan.value.trim(),uraian:form.uraian.value.trim(),paraf:signature,keterangan:form.keterangan.value.trim()};
    const error=document.getElementById('gb-public-error');
    if(!token||!payload.name||!payload.uraian||!payload.paraf){error.textContent='Mohon lengkapi nama visitor, uraian tugas, dan tanda tangan digital.';return;}
    btn.disabled=true;btn.textContent='Menyimpan…';
    try{await gbPost(payload);document.getElementById('gb-public-form-wrap').innerHTML='<div class="gb-success"><i class="fa-solid fa-circle-check"></i><h2>Terima kasih!</h2><p>Data kunjungan Anda berhasil disimpan.</p></div>';}
    catch(e){error.textContent='Gagal menyimpan kunjungan: '+e.message;btn.disabled=false;btn.textContent='SIMPAN KUNJUNGAN';}
  }
  let gbHasSignature=false;
  function gbInitSignature(){
    const canvas=document.getElementById('gb-sign-canvas');if(!canvas)return;
    const ctx=canvas.getContext('2d');let drawing=false,last=null;
    const resize=()=>{const ratio=Math.max(1,window.devicePixelRatio||1),rect=canvas.getBoundingClientRect();const snapshot=gbHasSignature?canvas.toDataURL():null;canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(150*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#172033';if(snapshot){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,150);img.src=snapshot;}};
    resize();window.addEventListener('resize',resize);
    const point=e=>{const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
    canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=point(e);canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last.x,last.y,1.2,0,Math.PI*2);ctx.fill();gbHasSignature=true;});
    canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;gbHasSignature=true;});
    const stop=()=>{drawing=false;last=null;};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('pointerleave',e=>{if(e.buttons===0)stop();});
    document.getElementById('gb-sign-undo')?.addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);gbHasSignature=false;});
  }
  window.gbSignatureData=()=>{const c=document.getElementById('gb-sign-canvas');return gbHasSignature&&c?c.toDataURL('image/png'):'';};

  async function gbStartPublic(){
    const token=(new URLSearchParams(location.search).get('token')||'').trim();
    const wrap=document.getElementById('gb-public-form-wrap');
    if(!token){wrap.innerHTML='<p class="gb-error">Link Buku Tamu tidak valid karena token tidak tersedia.</p>';return;}
    try{
      const result=await gbPost({action:'getGuestbookPublicInfo',token});const branch=result.branch||{};
      document.getElementById('gb-public-branch').textContent='Cabang: '+(branch.name||'ADM Priangan 2');
      wrap.innerHTML=`<form id="gb-public-form"><div class="gb-field"><label>Nama Visitor *</label><input name="nama" maxlength="100" required autocomplete="name" placeholder="Nama lengkap pengunjung"></div><div class="gb-field"><label>Jabatan</label><input name="jabatan" maxlength="100" placeholder="Jabatan / posisi"></div><div class="gb-field"><label>Uraian Tugas / Keperluan *</label><textarea name="uraian" maxlength="500" rows="3" required placeholder="Tuliskan uraian tugas atau keperluan kunjungan"></textarea></div><div class="gb-field"><label>Tanda Tangan Digital (E-Sign) <span style="color:#dc2626">*</span></label><div class="gb-sign-wrap"><div class="gb-sign-head"><span>Gunakan jari atau mouse untuk tanda tangan</span><div class="gb-sign-actions"><button type="button" id="gb-sign-undo">Hapus</button></div></div><canvas id="gb-sign-canvas" class="gb-sign-canvas" aria-label="Area tanda tangan digital"></canvas><div class="gb-sign-hint">Pastikan tanda tangan terlihat jelas sebelum menyimpan.</div></div></div><div class="gb-field"><label>Keterangan</label><textarea name="keterangan" maxlength="500" rows="2" placeholder="Keterangan tambahan (opsional)"></textarea></div><button class="gb-submit" type="submit">SIMPAN KUNJUNGAN</button><div id="gb-public-error" class="gb-error" role="alert"></div></form>`;
      document.getElementById('gb-public-form').addEventListener('submit',gbSubmitPublic);
      gbInitSignature();
    }catch(e){wrap.innerHTML='<p class="gb-error">Link Buku Tamu tidak valid atau tidak aktif. '+gbEsc(e.message)+'</p>';}
  }

(function(){
 const token=(new URLSearchParams(location.search).get('token')||'').trim();
 const wrap=document.getElementById('gb-public-form-wrap');
 const historyLink=document.getElementById('gb-open-history');
 if(historyLink && token) historyLink.href='riwayat.html?token='+encodeURIComponent(token);
 if(!token){document.getElementById('gb-public-branch').textContent='Tautan tidak valid';wrap.innerHTML='<p class="gb-error">Token cabang tidak ditemukan. Silakan scan QR Code yang diberikan oleh cabang.</p>';if(historyLink){historyLink.removeAttribute('href');historyLink.setAttribute('aria-disabled','true');historyLink.style.opacity='.5';}return;}
 gbStartPublic();
})();
</script></body></html>
