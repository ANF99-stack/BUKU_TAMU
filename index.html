<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#991b1b"><title>Buku Tamu Digital | ADM Priangan 2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7f7,#f1f5f9);font-family:Arial,Helvetica,sans-serif;color:#172033;min-height:100vh}
.gb-shell{max-width:1200px;margin:18px auto;padding:0 4px;color:#172033}.gb-hero{background:linear-gradient(120deg,#7f1d1d,#dc2626);border-radius:18px;padding:25px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 28px #991b1b22}.gb-kicker{font-size:11px;letter-spacing:2px;font-weight:800;opacity:.8}.gb-hero h2{margin:7px 0;font-size:25px}.gb-hero p{margin:0;opacity:.9}.gb-hero-icon{font-size:44px;opacity:.8}.gb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.gb-stat,.gb-panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:17px;box-shadow:0 4px 16px #0f172a08}.gb-stat span{display:block;color:#64748b;font-size:13px}.gb-stat b{display:block;font-size:26px;margin-top:6px;color:#991b1b}.gb-panel{margin:14px 0}.gb-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.gb-panel-head h3{margin:0 0 5px;font-size:17px}.gb-panel-head p,.gb-qr-info p{margin:0;color:#64748b;font-size:13px}.gb-qr-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.gb-qr-preview{width:170px;text-align:center}.gb-qr-preview img{width:150px;height:150px;object-fit:contain;border:1px solid #e5e7eb;border-radius:12px;padding:7px}.gb-qr-preview small{display:block;margin-top:6px;color:#64748b}.gb-qr-info{flex:1;min-width:240px}.gb-link-text{word-break:break-all;margin:7px 0 12px!important;color:#991b1b!important}.gb-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.gb-btn{border:0;border-radius:9px;background:#b91c1c;color:white;padding:10px 14px;font-weight:700;cursor:pointer}.gb-btn.secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}.gb-filters{display:flex;gap:10px;margin-bottom:12px}.gb-filters input{border:1px solid #cbd5e1;border-radius:9px;padding:10px;min-width:180px}.gb-table-wrap{overflow:auto}.gb-table{width:100%;border-collapse:collapse;min-width:760px;font-size:13px}.gb-table th,.gb-table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.gb-table th{background:#f8fafc;color:#475569}.gb-status{font-size:13px;color:#64748b;margin:8px 0}.gb-public-page{max-width:620px;margin:32px auto;padding:18px;font-family:inherit;color:#172033}.gb-public-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 12px 36px #0f172a12}.gb-public-brand{font-size:11px;letter-spacing:2px;color:#b91c1c;font-weight:800}.gb-public-card h1{font-size:24px;margin:8px 0}.gb-public-card p{color:#64748b}.gb-field{margin:14px 0}.gb-field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.gb-field input,.gb-field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.gb-submit{width:100%;padding:13px;border:0;border-radius:10px;background:#b91c1c;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.gb-submit:disabled{opacity:.6;cursor:wait}.gb-success{text-align:center;padding:24px 8px}.gb-success i{font-size:48px;color:#16a34a}.gb-error{color:#b91c1c;font-size:13px;margin-top:10px}@media(max-width:650px){.gb-stats{grid-template-columns:1fr}.gb-filters{flex-direction:column}.gb-filters input{width:100%;box-sizing:border-box}.gb-hero{padding:20px}.gb-hero h2{font-size:21px}.gb-panel{padding:13px}.gb-panel-head{align-items:flex-start}.gb-public-page{margin:12px auto;padding:10px}}
.gb-public-page{max-width:620px;margin:32px auto;padding:18px}.gb-public-card{padding:clamp(20px,5vw,30px)}
.gb-public-card input:focus,.gb-public-card textarea:focus{outline:2px solid #fecaca;border-color:#b91c1c}
.gb-public-card .gb-public-brand{display:flex;align-items:center;gap:8px}.gb-public-brand:before{content:'📖';font-size:18px}
.gb-public-branch{background:#fff1f2;color:#9f1239;padding:11px 13px;border-radius:9px;font-weight:700;font-size:14px;margin:16px 0}
.gb-loading{text-align:center;color:#64748b;padding:20px}.gb-success{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;color:#166534}.gb-success p{color:#166534}
@media(max-width:650px){.gb-public-page{margin:12px auto;padding:10px}.gb-public-card{border-radius:14px}}
</style></head><body>
<main class="gb-public-page"><section class="gb-public-card">
<div class="gb-public-brand">ADM PRIANGAN 2 · BUKU TAMU DIGITAL</div>
<h1>Form Buku Tamu</h1><p>Selamat datang. Silakan isi data kunjungan Anda. Data akan langsung tercatat setelah dikirim.</p>
<div id="gb-public-branch" class="gb-public-branch">Memvalidasi link cabang…</div>
<div id="gb-public-form-wrap" class="gb-loading">Mohon tunggu sebentar…</div>
<footer style="text-align:center;color:#94a3b8;font-size:11px;margin-top:22px">Sistem Buku Tamu Digital · ADM Priangan 2</footer>
</section></main>
<script>
const GB_API = 'https://script.google.com/macros/s/AKfycbxjk1LKASe0zd5rTkf0eXKtBdBie1uoDHA9HAs2YM2P8DhiKaYQsrZ_xZ88eD8nucdL_g/exec';
const gbEsc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbPost = async payload => {
  const r=await fetch(GB_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify(payload)});
  const data=await r.json();
  if(!r.ok || data?.status==='error' || data?.success===false) throw new Error(data?.message||`Permintaan gagal (${r.status})`);
  return data;
};
  async function gbSubmitPublic(event){
    event.preventDefault();const form=event.currentTarget,btn=form.querySelector('button[type=submit]');if(btn.disabled)return;
    const token=(new URLSearchParams(location.search).get('token')||'').trim();
    const payload={action:'saveGuestbookEntry',token,name:form.nama.value.trim(),jabatan:form.jabatan.value.trim(),uraian:form.uraian.value.trim(),paraf:form.paraf.value.trim(),keterangan:form.keterangan.value.trim()};
    const error=document.getElementById('gb-public-error');
    if(!token||!payload.name||!payload.uraian||!payload.paraf){error.textContent='Mohon lengkapi nama visitor, uraian tugas, dan paraf.';return;}
    btn.disabled=true;btn.textContent='Menyimpan…';
    try{await gbPost(payload);document.getElementById('gb-public-form-wrap').innerHTML='<div class="gb-success"><i class="fa-solid fa-circle-check"></i><h2>Terima kasih!</h2><p>Data kunjungan Anda berhasil disimpan.</p></div>';}
    catch(e){error.textContent='Gagal menyimpan kunjungan: '+e.message;btn.disabled=false;btn.textContent='SIMPAN KUNJUNGAN';}
  }
  async function gbStartPublic(){
    const token=(new URLSearchParams(location.search).get('token')||'').trim();
    const wrap=document.getElementById('gb-public-form-wrap');
    if(!token){wrap.innerHTML='<p class="gb-error">Link Buku Tamu tidak valid karena token tidak tersedia.</p>';return;}
    try{
      const result=await gbPost({action:'getGuestbookPublicInfo',token});const branch=result.branch||{};
      document.getElementById('gb-public-branch').textContent='Cabang: '+(branch.name||'ADM Priangan 2');
      wrap.innerHTML=`<form id="gb-public-form"><div class="gb-field"><label>Nama Visitor *</label><input name="nama" maxlength="100" required autocomplete="name" placeholder="Nama lengkap pengunjung"></div><div class="gb-field"><label>Jabatan</label><input name="jabatan" maxlength="100" placeholder="Jabatan / posisi"></div><div class="gb-field"><label>Uraian Tugas / Keperluan *</label><textarea name="uraian" maxlength="500" rows="3" required placeholder="Tuliskan uraian tugas atau keperluan kunjungan"></textarea></div><div class="gb-field"><label>Paraf *</label><input name="paraf" maxlength="100" required placeholder="Ketik nama atau paraf singkat"></div><div class="gb-field"><label>Keterangan</label><textarea name="keterangan" maxlength="500" rows="2" placeholder="Keterangan tambahan (opsional)"></textarea></div><button class="gb-submit" type="submit">SIMPAN KUNJUNGAN</button><div id="gb-public-error" class="gb-error" role="alert"></div></form>`;
      document.getElementById('gb-public-form').addEventListener('submit',gbSubmitPublic);
    }catch(e){wrap.innerHTML='<p class="gb-error">Link Buku Tamu tidak valid atau tidak aktif. '+gbEsc(e.message)+'</p>';}
  }

(function(){
 const token=(new URLSearchParams(location.search).get('token')||'').trim();
 const wrap=document.getElementById('gb-public-form-wrap');
 if(!token){document.getElementById('gb-public-branch').textContent='Tautan tidak valid';wrap.innerHTML='<p class="gb-error">Token cabang tidak ditemukan. Silakan scan QR Code yang diberikan oleh cabang.</p>';return;}
 gbStartPublic();
})();
</script></body></html>
